name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          # Skip cache save on PR runs — the Post step's tar.exe is
          # flaky on windows-latest (file locks under target/ make
          # the save fail and mark the otherwise-green job FAILURE,
          # blocking renovate auto-merge for downstream consumers).
          # Main keeps saving so every PR rebuild gets a warm cache.
          save-if: ${{ github.ref == 'refs/heads/main' }}
        # The GH Actions cache backend transient-flakes the restore
        # step on windows-latest just often enough to gate release
        # pipelines (verified on yukimemi/kanade@v0.6.2 — the cache
        # restore died mid-tar, killed the Windows build matrix, and
        # blocked the publish). Fall through to a cold cargo build
        # when the restore errors out: ~3–5 min slower on a single
        # job, but self-healing instead of release-blocking.
        continue-on-error: true
      - run: cargo check --all-targets

  test:
    # Windows is split into `test-windows-unit` + `test-windows-shard` and
    # reported under the same required name by `test-windows` below.
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
        # See the check job above for why continue-on-error is set
        # on every rust-cache restore (transient GH Actions cache
        # backend flake on windows-latest).
        continue-on-error: true
      # `cargo test --all-targets` covers lib / bins / tests / benches
      # / examples but EXCLUDES doc tests, so run --doc separately.
      # Doc-test step is gated on `src/lib.rs` presence: `cargo test
      # --doc` errors with `no library targets found` on bin-only
      # crates (yukimemi/todoke#50, yukimemi/rvpm#176 track the
      # consumer-side refactor). Drop this `if:` once both land.
      # The integration binaries (tests/*.rs, ~40 of them) used to run one
      # binary after another, which dominated the Windows job. nextest runs
      # them side by side, one process per test (config:
      # .config/nextest.toml). Lib / bin unit tests keep `cargo test`: they
      # share one process on purpose (a pinned magi home, the report colour
      # flag) and fail when split one test per process. Together with the
      # doc-test step below this covers everything `cargo test --all-targets`
      # ran; examples hold no tests.
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - run: cargo test --lib --bins
      - run: cargo nextest run --profile ci --test '*'
      - if: ${{ hashFiles('src/lib.rs') != '' }}
        run: cargo test --doc
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.os }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
        # The junit report is a diagnostic aid, not a gate. A transient
        # GitHub artifact-service failure (CreateArtifact twirp timeout,
        # run 39338929309 / job 118355342719) after every test passed
        # turned a green job red. Keep the failure in the log but never
        # let the upload decide the job result; a failing test step
        # still fails the job.
        continue-on-error: true

  test-windows-unit:
    name: test windows unit
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: windows-unit
          save-if: ${{ github.ref == 'refs/heads/main' }}
        continue-on-error: true
      - run: cargo test --lib --bins
      - if: ${{ hashFiles('src/lib.rs') != '' }}
        run: cargo test --doc

  test-windows-shard:
    # The integration binaries are CPU-bound on a 4-vCPU Windows runner (the
    # summed test time is ~3.8x the wall time), so they are spread over
    # runners with `--partition`. Each shard recompiles them. When changing
    # the shard count, change the `--partition` denominator, the job name and
    # the matrix together.
    name: test windows shard ${{ matrix.shard }}/3
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          # Identical contents in every shard: share one key, and let one
          # shard save it so they do not race.
          key: windows-shard
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.shard == 1 }}
        continue-on-error: true
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - run: cargo nextest run --profile ci --test '*' --partition count:${{ matrix.shard }}/3
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-windows-${{ matrix.shard }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
        # Non-fatal for the same reason as the junit upload in the
        # test job above (transient artifact-service failure).
        continue-on-error: true

  test-windows:
    # The required status check `test (windows-latest)`. It must fail when any
    # part failed or was skipped: `needs` alone would leave a skipped job
    # looking green.
    name: test (windows-latest)
    runs-on: ubuntu-latest
    needs: [test-windows-unit, test-windows-shard]
    if: always()
    steps:
      - run: |
          echo "unit=${{ needs.test-windows-unit.result }} shards=${{ needs.test-windows-shard.result }}"
          [ "${{ needs.test-windows-unit.result }}" = success ] && [ "${{ needs.test-windows-shard.result }}" = success ]

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  editorconfig:
    # Enforces the repo's `.editorconfig` (LF, trimmed trailing
    # whitespace, per-filetype indent width) across every tracked file,
    # not just Rust sources. `cargo make check`'s `editorconfig-check`
    # task runs the same tool locally but skips gracefully when the
    # `editorconfig-checker` binary isn't on PATH (it isn't a Rust
    # crate, so `cargo install` can't fetch it) — this job is the
    # actual enforcement gate.
    name: editorconfig
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: editorconfig-checker/action-editorconfig-checker@v3.0.0
      - run: editorconfig-checker

  clippy:
    # Matrix across all three OSes so OS-specific dead code (e.g. helpers
    # gated under `cfg(target_os = "windows")`) is caught everywhere, not
    # just on the maintainer's machine. Without this, a Windows-only
    # helper looks fine on a Windows pre-push hook but blows up the Linux
    # clippy run.
    name: clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
        # See the check job above for why continue-on-error is set
        # on every rust-cache restore (transient GH Actions cache
        # backend flake on windows-latest).
        continue-on-error: true
      - run: cargo clippy --all-targets -- -D warnings

  lockfile:
    # Catches stale Cargo.lock (e.g. version bumped in Cargo.toml but lock
    # still points at the old version) before it reaches the publish job,
    # which uses --locked and would otherwise fail there.
    name: cargo lockfile in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
        # See the check job above for why continue-on-error is set
        # on every rust-cache restore (transient GH Actions cache
        # backend flake on windows-latest).
        continue-on-error: true
      - run: cargo check --locked --all-targets

  coverage:
    # llvm-cov on Linux + Codecov upload. taiki-e/install-action grabs the
    # cargo-llvm-cov binary. codecov-action@v5 nominally accepts tokenless
    # uploads from public repos, but in practice Codecov rejects them with
    # 'Token required - not valid tokenless upload', so plumb CODECOV_TOKEN
    # through as a repo secret. `fail_ci_if_error: false` still keeps a
    # flaky upload from gating merges.
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
        # See the check job above for why continue-on-error is set
        # on every rust-cache restore (transient GH Actions cache
        # backend flake on windows-latest).
        continue-on-error: true
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false
