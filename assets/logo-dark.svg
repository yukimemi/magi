<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 120" role="img" aria-label="magi — blind multi-agent implementation competition">
  <title>Three independent candidates converge on a single verdict</title>
  <!-- 三賢者 — the standing Japanese rendering of "magi": three wise ones deliberate and hand down one answer. -->
  <!-- icon (same shapes as assets/icon.svg, brighter fills for dark backgrounds) -->
  <g transform="translate(23, 20) scale(0.31)">
    <g fill="none" stroke-width="18" stroke-linecap="round">
      <path d="M 50 80 C 50 124, 78 136, 128 166" stroke="#e58050" />
      <path d="M 128 80 L 128 166" stroke="#3aa9b8" />
      <path d="M 206 80 C 206 124, 178 136, 128 166" stroke="#b78fe0" />
      <path d="M 128 172 L 128 216" stroke="#e9c14a" />
    </g>
    <rect x="111" y="149" width="34" height="34"
          transform="rotate(45 128 166)"
          fill="#e9c14a" />
    <circle cx="50"  cy="54" r="21" fill="#e58050" />
    <circle cx="128" cy="54" r="21" fill="#3aa9b8" />
    <circle cx="206" cy="54" r="21" fill="#b78fe0" />
  </g>
  <text x="118" y="68"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-weight="700" font-size="58" letter-spacing="-2"
        fill="#f5f5f5">magi</text>
  <text x="120" y="102"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-style="italic" font-size="16"
        fill="#b8b8b8">三賢者 — blind multi-agent implementation competition</text>
</svg>
