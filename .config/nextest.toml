# Used by `cargo make test` / `cargo make check` (`[profile.default]`) and the
# test jobs in `.github/workflows/ci.yml` (`--profile ci`) under
# `PJ_RUST_TEST_RUNNER = "nextest-unit"`. Nextest runs lib, bin, and
# integration tests one process per test in parallel; examples, benches, and
# doc tests run through `cargo test`.

[profile.default]
# Local runs (`cargo make test`, the magi `verify.e2e`) retry a failed lib,
# bin, or integration test twice. The suite always runs under load (several
# magi runs at once), and timing-sensitive tests that pass when run again were
# failing `verify.e2e` and costing a full suite rerun plus a fixer round on
# tests the change never touched. A test that fails and then passes is reported
# as `FLAKY` in nextest's output, so the flake stays visible without deciding
# the run. A test that fails every attempt still fails. CI (`--profile ci`)
# retries the same way, so a local pass and a CI pass mean the same thing.
retries = 2

[profile.ci]
# Same count as the default profile. A version-bump-only release PR was held by
# one timing-dependent test on one runner; retrying the test takes seconds,
# rerunning the job takes its whole duration. A retried pass is still printed as
# `FLAKY` and recorded in junit.xml.
retries = 2
fail-fast = false

[profile.ci.junit]
path = "junit.xml"

# `tests/common::isolated` caps concurrent children at half the CPUs, at most
# four per binary. Under nextest every test is its own process and binaries
# overlap, so the cap also lives here, or end-to-end scenes (each spawning git,
# and a mock agent) pile up and trip node timeouts.
[test-groups]
e2e = { max-threads = 4 }
chrome = { max-threads = 2 }

[[profile.default.overrides]]
filter = "binary(web_render)"
test-group = "chrome"

[[profile.default.overrides]]
filter = "kind(test) & not binary(web_render) & not binary(cli_help_color)"
test-group = "e2e"
