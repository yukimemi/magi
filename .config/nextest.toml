# Used by the `test` job in .github/workflows/ci.yml (`--profile ci`).
# `cargo make check` keeps running plain `cargo test`; nextest only changes
# how the same tests are scheduled (one process per test, binaries in parallel).

[profile.default]
# Local runs (`cargo make test`, the magi `verify.e2e`) retry a failed test
# twice. The suite always runs under load (several magi runs at once), and
# integration tests that pass when run again were failing `verify.e2e` and
# costing a full suite rerun plus a fixer round on tests the change never
# touched. A test that fails and then passes is reported as `FLAKY` in
# nextest's output, so the flake stays visible without deciding the run.
# A test that fails every attempt still fails. CI (`--profile ci`) keeps
# `retries = 0`, so flakes still show there as failures.
retries = 2

[profile.ci]
retries = 0
fail-fast = false

[profile.ci.junit]
path = "junit.xml"

# `tests/common::isolated` caps concurrent children at half the CPUs, at most
# four per binary. Under nextest every test is its own process and binaries
# overlap, so the cap also lives here, or end-to-end scenes (each spawning git,
# and a mock agent) pile up and trip node timeouts.
[test-groups]
e2e = { max-threads = 4 }
chrome = { max-threads = 2 }

[[profile.default.overrides]]
filter = "binary(web_render)"
test-group = "chrome"

[[profile.default.overrides]]
filter = "kind(test) & not binary(web_render) & not binary(cli_help_color)"
test-group = "e2e"
